name: Chinese build

# The source in this repository is upstream's own; zh/zh.tsv is applied here,
# so following a new upstream release is a merge and one script run.
on:
  push:
    branches: [main]
    tags: ["v*-cn*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    name: Catalog applies cleanly
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply zh/zh.tsv
        run: python3 scripts/zh/apply.py --check

  build:
    name: 3DSX and CIA (zh)
    runs-on: ubuntu-24.04
    needs: [catalog]
    steps:
      - uses: actions/checkout@v4

      - name: Apply zh/zh.tsv
        run: python3 scripts/zh/apply.py

      - name: Rebuild the page editor
        run: ./scripts/make-editor.sh

      - name: Build with the pinned toolchain
        run: ./scripts/build.sh
        env:
          THREEDSDL_BUILD_JOBS: 4

      - uses: actions/upload-artifact@v4
        with:
          name: 3dsDL-zh-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish a test release
    # A tag like v0.9.0-cn.2 is published as a normal release, so the
    # update check inside an installed copy offers it.
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-cn')
    needs: [catalog, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: 3dsDL-zh-${{ github.sha }}
          path: dist

      - name: Name the files after the version
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          cd dist
          for file in 3dsDL.cia 3dsDL.3dsx 3dsDL.smdh; do
            mv "${file}" "3dsDL-${version}.${file##*.}"
          done
          sha256sum "3dsDL-${version}.cia" "3dsDL-${version}.3dsx" \
            > "3dsDL-${version}.sha256"

      - name: Make the QR code FBI scans
        # The CIA's own download link, so the console installs it straight
        # from the release without a card reader.
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          python3 -m pip install --quiet --disable-pip-version-check segno
          python3 - "${version}" <<'PY'
          import os, sys, segno
          version = sys.argv[1]
          tag = os.environ["GITHUB_REF_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          url = (f"https://github.com/{repo}/releases/download/{tag}/"
                 f"3dsDL-{version}.cia")
          segno.make(url, error="m").save(
              f"dist/3dsDL-{version}-cia-qr.png", scale=10, border=4)
          with open("release-notes.md", "w", encoding="utf-8") as notes:
              notes.write(
                  f"![在 FBI 中扫码安装]"
                  f"(https://github.com/{repo}/releases/download/{tag}/"
                  f"3dsDL-{version}-cia-qr.png)\n\n"
                  "FBI → Remote Install → Scan QR Code 即可安装。\n\n")
              notes.write(open(".github/zh-release-notes.md",
                               encoding="utf-8").read())
          PY

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            dist/3dsDL-* \
            --title "3dsDL ${version} 简体中文版" \
            --notes-file release-notes.md
