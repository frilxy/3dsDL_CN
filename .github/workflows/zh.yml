name: Chinese build

# The source in this repository is upstream's own; zh/zh.tsv is applied here,
# so following a new upstream release is a merge and one script run.
on:
  push:
    branches: [main]
    tags: ["v*-cn*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    name: Catalog applies cleanly
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply zh/zh.tsv
        run: python3 scripts/zh/apply.py --check

  build:
    name: 3DSX and CIA (zh)
    runs-on: ubuntu-24.04
    needs: [catalog]
    steps:
      - uses: actions/checkout@v4

      - name: Apply zh/zh.tsv
        run: python3 scripts/zh/apply.py

      - name: Rebuild the page editor
        run: ./scripts/make-editor.sh

      - name: Build with the pinned toolchain
        run: ./scripts/build.sh
        env:
          THREEDSDL_BUILD_JOBS: 4

      - uses: actions/upload-artifact@v4
        with:
          name: 3dsDL-zh-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish a test release
    # A tag like v0.9.0-cn.1 marks a build for testers. It goes out at once
    # as a pre-release, which GitHub never calls the latest, so 3dsDL's
    # update check in anyone's copy does not offer it.
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-cn')
    needs: [catalog, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: 3dsDL-zh-${{ github.sha }}
          path: dist

      - name: Name the files after the version
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          cd dist
          for file in 3dsDL.cia 3dsDL.3dsx 3dsDL.smdh; do
            mv "${file}" "3dsDL-${version}.${file##*.}"
          done
          sha256sum "3dsDL-${version}.cia" "3dsDL-${version}.3dsx" \
            > "3dsDL-${version}.sha256"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            dist/3dsDL-* \
            --title "3dsDL ${version} 简体中文测试版" \
            --notes-file .github/zh-release-notes.md \
            --prerelease
