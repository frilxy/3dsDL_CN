name: Chinese build

# The source in this repository is upstream's own; zh/zh.tsv is applied here,
# so following a new upstream release is a merge and one script run.
on:
  push:
    branches: [main]
    tags: ["v*-cn*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    name: Catalog applies cleanly
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply zh/zh.tsv
        run: python3 scripts/zh/apply.py --check

  build:
    name: 3DSX and CIA (zh)
    runs-on: ubuntu-24.04
    needs: [catalog]
    steps:
      - uses: actions/checkout@v4

      # One package: the font ships inside it. Noto Sans CN is the console's
      # own shared font and is OFL, so there is no reason for a second build
      # that leans on whatever font the console happens to have.
      - name: Build
        run: |
          set -eu
          printf 'cn-fix\n' > zh/VERSION_SUFFIX
          python3 scripts/zh/apply.py
          ./scripts/make-editor.sh
          ./scripts/build.sh
          mkdir -p out
          cp dist/3dsDL.cia out/3dsDL.cia
          cp dist/3dsDL.3dsx out/3dsDL.3dsx
          cp dist/3dsDL.smdh out/3dsDL.smdh
        env:
          THREEDSDL_BUILD_JOBS: 4

      - uses: actions/upload-artifact@v4
        with:
          name: 3dsDL-zh-${{ github.sha }}
          path: out/
          if-no-files-found: error

  release:
    name: Publish a release
    # Published as a normal release, so the update check inside an installed
    # copy offers it.
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-cn')
    needs: [catalog, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: 3dsDL-zh-${{ github.sha }}
          path: dist

      - name: Name the files after the version
        run: |
          set -eu
          # VERSION already carries the fork's suffix ("0.9.0-cn-fix").
          version="$(tr -d '[:space:]' < VERSION)"
          cd dist
          for kind in cia 3dsx smdh; do
            mv "3dsDL.${kind}" "3dsDL-${version}.${kind}"
          done
          sha256sum "3dsDL-${version}.cia" "3dsDL-${version}.3dsx" \
            > "3dsDL-${version}.sha256"

      - name: Make the QR code FBI scans
        # The CIA's own download link, so the console installs it straight
        # from the release without a card reader.
        run: |
          set -eu
          version="$(tr -d '[:space:]' < VERSION)"
          python3 -m pip install --quiet --disable-pip-version-check segno
          VERSION="${version}" python3 - <<'PY'
          import os, segno
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["GITHUB_REF_NAME"]
          name = f"3dsDL-{os.environ['VERSION']}"
          url = f"https://github.com/{repo}/releases/download/{tag}/{name}.cia"
          qr = f"{name}-cia-qr.png"
          segno.make(url, error="m").save(f"dist/{qr}", scale=10, border=4)
          body = ".github/zh-rc-notes.md" if "-rc." in tag else ".github/zh-release-notes.md"
          with open("release-notes.md", "w", encoding="utf-8") as notes:
              notes.write(f"![扫码安装](https://github.com/{repo}/releases/download/"
                          f"{tag}/{qr})\n\n"
                          "FBI → Remote Install → Scan QR Code 即可安装。\n\n")
              notes.write(open(body, encoding="utf-8").read())
          PY

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # A preview stays a pre-release, so an installed copy's update
          # check does not offer it as the next version.
          preview=()
          case "${GITHUB_REF_NAME}" in
            *-rc.*) preview+=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            dist/3dsDL-* \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            "${preview[@]}"
