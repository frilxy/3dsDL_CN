name: Chinese build

# The source in this repository is upstream's own; zh/zh.tsv is applied here,
# so following a new upstream release is a merge and one script run.
on:
  push:
    branches: [main]
    tags: ["v*-cn*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    name: Catalog applies cleanly
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply zh/zh.tsv
        run: python3 scripts/zh/apply.py --check

  build:
    name: 3DSX and CIA (zh)
    runs-on: ubuntu-24.04
    needs: [catalog]
    steps:
      - uses: actions/checkout@v4

      # Two builds of one version: one carrying the font, one using the
      # console's own. The font one has the higher CIA number, so installing
      # it over the other works; see .github/zh-release-notes.md.
      - name: Build with the bundled font
        run: |
          set -eu
          printf 'cnwithfont\n' > zh/VERSION_SUFFIX
          python3 scripts/zh/apply.py
          ./scripts/make-editor.sh
          ./scripts/build.sh
          mkdir -p out
          cp dist/3dsDL.cia out/3dsDL-font.cia
          cp dist/3dsDL.3dsx out/3dsDL-font.3dsx
          cp dist/3dsDL.smdh out/3dsDL-font.smdh
        env:
          THREEDSDL_BUILD_JOBS: 4

      - name: Build without it
        run: |
          set -eu
          git checkout -- .
          rm -f romfs/hanfont.bcfnt
          printf 'cn\n' > zh/VERSION_SUFFIX
          python3 scripts/zh/apply.py
          ./scripts/make-editor.sh
          ./scripts/build.sh
          cp dist/3dsDL.cia out/3dsDL.cia
          cp dist/3dsDL.3dsx out/3dsDL.3dsx
          cp dist/3dsDL.smdh out/3dsDL.smdh
        env:
          THREEDSDL_BUILD_JOBS: 4

      - uses: actions/upload-artifact@v4
        with:
          name: 3dsDL-zh-${{ github.sha }}
          path: out/
          if-no-files-found: error

  release:
    name: Publish a release
    # Published as a normal release, so the update check inside an installed
    # copy offers it.
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-cn')
    needs: [catalog, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: 3dsDL-zh-${{ github.sha }}
          path: dist

      - name: Name the files after the version
        run: |
          set -eu
          # The release is named after the version alone; the suffix only
          # tells the two packages apart.
          version="${GITHUB_REF_NAME#v}"
          base="${version}"
          cd dist
          for kind in cia 3dsx smdh; do
            mv "3dsDL.${kind}" "3dsDL-${base}.${kind}"
            mv "3dsDL-font.${kind}" "3dsDL-${base}-font.${kind}"
          done
          sha256sum "3dsDL-${base}.cia" "3dsDL-${base}.3dsx" \
            > "3dsDL-${base}.sha256"
          sha256sum "3dsDL-${base}-font.cia" "3dsDL-${base}-font.3dsx" \
            > "3dsDL-${base}-font.sha256"

      - name: Make the QR codes FBI scans
        # Each CIA's own download link, so the console installs it straight
        # from the release without a card reader.
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          python3 -m pip install --quiet --disable-pip-version-check segno
          python3 - "${version}" <<'PY'
          import os, sys, segno
          base = sys.argv[1]
          tag = os.environ["GITHUB_REF_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          names = [(f"3dsDL-{base}-font", "带字库版"),
                   (f"3dsDL-{base}", "不带字库版")]
          header = []
          for name, label in names:
              url = (f"https://github.com/{repo}/releases/download/{tag}/"
                     f"{name}.cia")
              qr = f"{name}-cia-qr.png"
              segno.make(url, error="m").save(f"dist/{qr}", scale=10, border=4)
              header.append(f"![{label}扫码安装]"
                            f"(https://github.com/{repo}/releases/download/"
                            f"{tag}/{qr})")
          with open("release-notes.md", "w", encoding="utf-8") as notes:
              notes.write("\n".join(header) + "\n\n"
                          "FBI → Remote Install → Scan QR Code 即可安装。\n\n")
              notes.write(open(".github/zh-release-notes.md",
                               encoding="utf-8").read())
          PY

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            dist/3dsDL-* \
            --title "3dsDL ${version%-cn} 简体中文版" \
            --notes-file release-notes.md
